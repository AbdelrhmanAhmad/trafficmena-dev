## B. Backend Environment

| Variable | Purpose | Required | Secret | Location | Notes |
|---|---|---|---|---|---|
| `NODE_ENV` | Runtime mode | Optional (default `development`) | No | `server/.env` / process manager | `production` triggers fail-fast guards |
| `PORT` | API listen port | Optional (default `3001`) | No | `server/.env` | |
| `DATABASE_URL` | Runtime DB connection | **Yes** (or full `PG*`) | Yes | `server/.env` | Zod: min 1 char |
| `DATABASE_ADMIN_URL` | Migrations DDL user | Optional (falls back to `DATABASE_URL`) | Yes | `server/.env` | Used by Drizzle only |
| `DB_SSL` | PostgreSQL TLS | **Prod: required `true`** | No | `server/.env` | Fail-fast if prod + false |
| `TRUST_PROXY` | Trust `X-Forwarded-For` / CF headers for client IP | Optional (default `false`) | No | `server/.env` | **Prod behind nginx/CF: `true`** |
| `CORS_ORIGIN` | Allowed SPA origin(s), comma-separated | Recommended | No | `server/.env` | Default fallback `http://localhost:5173` if empty — **Vite uses :8080** |
| `RESEND_API_KEY` | Email (OTP, invites, etc.) | **Prod: required** (`re_` prefix) | **Yes** | `server/.env` | Dev: simulates if missing/invalid |
| `RESEND_FROM` | Sender `"Name <email>"` | Optional | No | `server/.env` | Default: `TrafficMENA <hello@updates.trafficmena.com>` |
| `BETTER_AUTH_SECRET` | Session/OTP signing | **Yes** (≥32 chars) | **Yes** | `server/.env` | Blocks placeholder in prod |
| `BETTER_AUTH_ISSUER` | Better Auth base URL | Optional | No | `server/.env` | Default `http://localhost:3001`; prod should be HTTPS API URL |
| `APP_BASE_URL` | SPA links in emails/payments | Optional (default localhost:8080) | No | `server/.env` | Invitations, thank-you, payment redirects |
| `API_BASE_URL` | Webhook callback base | Optional | No | `server/.env` | Prod comment: `https://www.trafficmena.com` |
| `BUNNY_STORAGE_ZONE` | Upload storage zone name | Optional (uploads disabled if missing) | No | `server/.env` | Public in CDN URLs |
| `BUNNY_STORAGE_ACCESS_KEY` | Bunny Storage Zone password | Optional | **Yes** | `server/.env` | Upload API auth |
| `BUNNY_STORAGE_CDN_URL` | Public CDN base URL | Optional | No | `server/.env` | Public |
| `FAWATERK_API_KEY` | Webhook HMAC secret (v3) | **Prod: required** | **Yes** | `server/.env` | Not used for OAuth API calls |
| `FAWATERK_ENV` | Gateway environment | Optional (default `staging`) | No | `server/.env` | `staging` \| `live` |
| `FAWATERK_CLIENT_ID` | OAuth client UUID | **Prod: required** | Semi | `server/.env` | UUID validated in prod |
| `FAWATERK_CLIENT_SECRET` | OAuth client secret | **Prod: required** (≥16) | **Yes** | `server/.env` | |
| `TURNSTILE_SECRET_KEY` | Turnstile server verify | Optional | **Yes** | `server/.env` | **No prod fail-fast** if missing |
| `INVITE_SESSION_SECRET` | Invite plugin internal auth | **Prod: required** (≥16) | **Yes** | `server/.env` | Missing → invite session disabled |
| `INVITATION_DAILY_LIMIT` | Bulk invite cap/admin/day | Optional (default 1000) | No | `server/.env` | |
| `AUTH_TEST_FIXED_OTP` | Fixed OTP `000000` | Test/dev only | No | `server/.env` | **Forbidden in production** |

