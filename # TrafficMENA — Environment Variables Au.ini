# TrafficMENA — Environment Variables Audit

**Scope:** Source-of-truth = الكود الفعلي (`process.env`, `import.meta.env`, `env.ts`).  
**Constraints respected:** لا تعديلات، لا secrets مطبوعة، لا commit/push.

---

## كيف يقرأ المشروع ملفات البيئة

| Layer | Working directory | Loader | Files read (Vite order) |
|---|---|---|---|
| **Frontend (Vite)** | Repo root | Vite built-in | `.env`, `.env.local`, `.env.[mode]`, `.env.[mode].local` |
| **Backend dev** | `server/` | `tsx -r dotenv/config` | `server/.env` only (cwd = server) |
| **Backend prod** | `server/` | **لا dotenv** — `node dist/index.js` يعتمد على env المحقون من systemd/Docker/CI |
| **Drizzle migrations** | `server/` | `drizzle.config.ts` → `dotenv` | `server/.env` (fallback: repo root `.env`) |

**الفرق الحاسم:**

| Variable | الملف الصحيح | السبب |
|---|---|---|
| `VITE_TURNSTILE_SITE_KEY` | **Repo root** `.env` | `import.meta.env` — يُحقَن وقت build/dev في الـ bundle |
| `TURNSTILE_SECRET_KEY` | **`server/.env`** | يُقرأ من `server/src/config/env.ts` عبر `process.env` |

**ملاحظة:** `VITE_*` أي متغير يبدأ بـ `VITE_` يصبح **عامًا في المتصفح** — ممنوع وضع secrets فيه.

