| `VITE_TURNSTILE_SITE_KEY` | Cloudflare Turnstile site key (widget) | Optional functionally; **required when backend يفرض Turnstile** | Cloudflare test key or real | Staging site key | Production site key | No (public site key) | Repo root `.env` / CI build env | **Yes** — baked at `npm run build` |
| `import.meta.env.DEV` | Vite built-in dev flag | Auto | `true` | `false` | `false` | No | N/A (Vite injects) | Yes |

**لا يوجد أي `VITE_*` آخر** في `src/` — فقط `VITE_TURNSTILE_SITE_KEY` في `Turnstile.tsx` + `vite-env.d.ts`.

