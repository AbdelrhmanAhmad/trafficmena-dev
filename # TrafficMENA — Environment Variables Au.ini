## E. Turnstile

| Side | Variable | File |
|---|---|---|
| Frontend | `VITE_TURNSTILE_SITE_KEY` | Repo root `.env` |
| Backend | `TURNSTILE_SECRET_KEY` | `server/.env` |

**متى يُفرض Turnstile؟** (`auth.ts`): `isTurnstileEnabled()` (= secret موجود) **AND** (`eventMode` OR IP OTP count ≥ 20).

**Backend behavior (`turnstile.ts`):**
- Secret missing + `development` → verify **skipped** (success)
- Secret missing + non-dev → verify **fails**
- **Startup does NOT fail** in production if secret missing — Turnstile simply disabled

**Frontend:** Site key missing → "Security check unavailable" (حتى لو backend يطلب token).

**Build:** `npm run build` يحتاج `VITE_TURNSTILE_SITE_KEY` في build environment إذا Turnstile مطلوب في prod/staging.

