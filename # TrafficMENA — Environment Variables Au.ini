## P.18 Production Build (`npm run build`)

1. Vite reads root `.env*` at **build time** only.
2. `import.meta.env.VITE_TURNSTILE_SITE_KEY` becomes a **static string** in `dist/`.
3. After build, the static server **does not read `.env`** — no runtime env for frontend.
4. That's why prod can work without root `.env` on the server **if** vars were provided during CI build.
5. **`VITE_*` must be set in CI/CD or shell before `npm run build`** — not on the runtime web server.

