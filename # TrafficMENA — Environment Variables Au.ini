## C. Database

| Variable | Used by | Role |
|---|---|---|
| `DATABASE_URL` | Runtime (`db/client.ts`), Drizzle fallback | **Primary** app connection string |
| `DATABASE_ADMIN_URL` | Drizzle migrations only | Admin user with schema permissions |
| `PGHOST`, `PGPORT`, `PGUSER`, `PGPASSWORD`, `PGDATABASE` | `db/client.ts`, `drizzle.config.ts` | **Fallback** if `DATABASE_URL` empty — builds connection string |
| `PGSSLMODE` | **Not read by app code** | Documented in `.env.example` for local Postgres/psql tooling |
| `DB_SSL` | `db/client.ts` Pool | Enables `{ rejectUnauthorized: false }` SSL — **prod mandatory** |

**هل تحتاج الاثنين؟** لا — **`DATABASE_URL` كافٍ للـ runtime**. `PG*` fallback فقط.  
**Migrations:** `DATABASE_ADMIN_URL ?? DATABASE_URL` في `drizzle.config.ts`.  
**لا duplicate requirement** — لكن `.env.example` يوثق الاثنين للـ local Postgres project-scoped setup.

