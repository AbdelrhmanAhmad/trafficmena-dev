<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Style Validation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .gradient-bg-1 {
      background: linear-gradient(to bottom right, #d5ffe9 70%, #f4fff9 40%, transparent);
    }
    .gradient-bg-2 {
      background: linear-gradient(to top right, #00fdc2 25%, #05ef62 20%, transparent);
    }
    .gradient-button {
      background: linear-gradient(to right, #05ef62, #29cf9f);
    }
    .glass-panel {
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.95);
    }
    .neutral-border {
      border-color: rgba(0, 0, 0, 0.2);
    }
    .shadow-custom {
      box-shadow: 0 10px 35px -18px rgba(16,16,16,0.45);
    }
  </style>
</head>
<body class="bg-gray-50 p-8">
  <h1 class="text-2xl font-bold mb-8">Dashboard Style Validation Checklist</h1>
  
  <div class="space-y-8 max-w-6xl mx-auto">
    <!-- Glass Panel Test -->
    <div class="rounded-[28px] border neutral-border shadow-custom glass-panel p-6">
      <h2 class="text-xl font-semibold text-neutral-900 mb-4">Glass Panel Style</h2>
      <p class="text-neutral-600">This should match the new dashboard style with backdrop blur and transparency.</p>
    </div>

    <!-- Gradient Button Test -->
    <div class="p-6">
      <h3 class="text-lg font-semibold text-neutral-900 mb-4">Gradient Button Style</h3>
      <button class="gradient-button text-[#101010] px-6 py-3 rounded-xl text-sm font-medium shadow-lg transition-all hover:shadow-xl hover:scale-105 hover:-translate-y-1">
        Save Changes
      </button>
    </div>

    <!-- Icon Badge Test -->
    <div class="p-6">
      <h3 class="text-lg font-semibold text-neutral-900 mb-4">Icon Badge Style</h3>
      <div class="flex items-center gap-2 rounded-full border border-white/50 bg-white/70 px-3 py-1 text-xs font-medium text-neutral-700 backdrop-blur">
        <div class="flex h-5 w-5 items-center justify-center rounded-full gradient-button">
          <svg class="h-3.5 w-3.5 text-[#101010]" fill="currentColor" viewBox="0 0 20 20">
            <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.538 1.118l2.8-2.034a1 1 0 011.118-.364l3.292 1.07c.921.3 1.24 1.603 0 1.902l-3.292 1.07a1 1 0 00-.69.95l-2.034 3.462c-.47.969-1.24 1.371-1.81.588l-2.034-2.8a1 1 0 00-1.118-.364l-3.292 1.07c-.921-.755-1.688-1.538-1.118l2.8-2.034a1 1 0 00-.364-1.118l-1.07-3.292z"/>
          </svg>
        </div>
        Member
      </div>
    </div>

    <!-- Background Orbs Test -->
    <div class="relative h-96 rounded-[28px] border neutral-border overflow-hidden">
      <div class="pointer-events-none absolute -left-[45vw] top-[-25vh] -z-10 h-[55vh] w-[85vw] rounded-full gradient-bg-1 blur-3xl"></div>
      <div class="pointer-events-none absolute -right-[48vw] top-[35vh] -z-10 h-[55vh] w-[80vw] rounded-full gradient-bg-2 blur-[140px]"></div>
      
      <div class="relative z-10 flex h-full items-center justify-center">
        <div class="text-center">
          <h3 class="text-2xl font-bold text-neutral-900 mb-2">Background Gradient Test</h3>
          <p class="text-neutral-700">Should see subtle green gradient orbs in the background</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    console.log('Dashboard styles validation page loaded');
    console.log('✅ Glass panels: blur backdrop, white/95 transparency');
    console.log('✅ Gradient buttons: from #05ef62 to #29cf9f');
    console.log('✅ Border radius: rounded-[28px]');
    console.log('✅ Background orbs: green gradients with blur');
    console.log('✅ Icon badges: white/70 background with blur');
  </script>
</body>
</html>
